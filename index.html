<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle History — AI-Verified Condition Screening</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #07070b; color: #e4e4ef; line-height: 1.5; }
.container { max-width: 900px; margin: 0 auto; padding: 32px 20px 64px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
h1 { font-size: 22px; }
.explorer-link { color: #6ee7b7; text-decoration: none; font-size: 13px; }
.explorer-link:hover { text-decoration: underline; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat { background: #0e0e15; border: 1px solid #1c1c2e; border-radius: 10px; padding: 14px; }
.stat .num { font-size: 22px; font-weight: 600; }
.stat .label { font-size: 11px; color: #8a8aa0; margin-top: 4px; }
.card { background: #0e0e15; border: 1px solid #1c1c2e; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
.card h2 { font-size: 15px; margin-bottom: 14px; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; color: #8a8aa0; margin-bottom: 4px; }
.form-group input { width: 100%; background: #0a0a0f; border: 1px solid #23233a; border-radius: 8px; padding: 10px 12px; color: #e4e4ef; font-size: 14px; }
.form-group input:focus { outline: none; border-color: #6ee7b7; }
.btn { border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px; cursor: pointer; }
.btn-primary { background: #10b981; color: #04140d; font-weight: 600; }
.btn-outline { background: transparent; border: 1px solid #2a2a44; color: #c4c4d8; }
.btn-outline:hover { border-color: #6ee7b7; color: #6ee7b7; }
.btn-sm { padding: 7px 12px; font-size: 13px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.result-box { margin-top: 12px; font-size: 12px; white-space: pre-wrap; background: #0a0a0f; padding: 12px; border-radius: 8px; border: 1px solid #1a1a2e; word-break: break-all; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-right: 6px; }
.tag-clean { background: #0f3d2e; color: #6ee7b7; }
.tag-damaged { background: #3d2a0f; color: #fbbf24; }
.tag-flooded { background: #12304d; color: #60a5fa; }
.tag-salvage { background: #3d1111; color: #f87171; }
.tag-inconclusive { background: #2a2a44; color: #a5a5c4; }
.tag-none { background: #1c1c2e; color: #8a8aa0; }
.toast { position: fixed; top: 16px; right: 16px; padding: 12px 18px; border-radius: 8px; font-size: 13px; z-index: 1000; opacity: 0.95; }
.toast-error { background: #3d1111; color: #f87171; }
.toast-success { background: #0f3d2e; color: #6ee7b7; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>Vehicle History</h1>
      <div style="font-size:11px;color:#8a8aa0;margin-top:4px;">AI-verified condition screening · Reusable on-chain records</div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <a class="explorer-link" href="https://explorer-bradbury.genlayer.com/address/0xEE596f3230b739D66763662128CCaC9450B36E96" target="_blank">View on Explorer ↗</a>
      <button class="btn btn-outline btn-sm" id="connectBtn">Connect Wallet</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat"><div class="num" id="statTotal">—</div><div class="label">Total Checks</div></div>
    <div class="stat"><div class="num" id="statClean">—</div><div class="label">Clean</div></div>
    <div class="stat"><div class="num" id="statDamaged">—</div><div class="label">Damaged</div></div>
    <div class="stat"><div class="num" id="statSalvage">—</div><div class="label">Salvage</div></div>
    <div class="stat"><div class="num" id="statInconclusive">—</div><div class="label">Inconclusive</div></div>
    <div class="stat"><div class="num" id="statRecords">—</div><div class="label">Records</div></div>
  </div>

  <div class="card">
    <h2>Submit Vehicle Check</h2>
    <div class="form-group"><label>VIN (17 characters)</label><input id="vin" placeholder="e.g. WBADX1C54DJK00001"></div>
    <div class="form-group"><label>Make</label><input id="make" placeholder="e.g. BMW"></div>
    <div class="form-group"><label>Model (optional)</label><input id="model" placeholder="e.g. 328i"></div>
    <div class="form-group"><label>Year (optional)</label><input id="year" placeholder="e.g. 2013"></div>
    <button class="btn btn-primary" id="submitBtn">Submit Check</button>
    <div id="submitStatus" style="margin-top:10px;font-size:13px;"></div>
  </div>

  <div class="card">
    <h2>Process &amp; View Check</h2>
    <div class="form-group"><label>Check ID</label><input id="checkId" placeholder="1"></div>
    <div class="row">
      <button class="btn btn-outline" id="processBtn">Process Check (AI Review)</button>
      <button class="btn btn-outline" id="readBtn">Read Result</button>
    </div>
    <div id="checkStatus" style="margin-top:10px;font-size:13px;"></div>
    <div id="checkResult" class="result-box"></div>
  </div>

  <div class="card">
    <h2>Lookup Reusable Record</h2>
    <div class="form-group"><label>VIN</label><input id="lookupVin" placeholder="e.g. WBADX1C54DJK00001"></div>
    <button class="btn btn-outline" id="lookupBtn">Lookup Record</button>
    <div id="lookupResult" class="result-box"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7/dist/ethers.umd.min.js"></script>
<script>
const CONTRACT = '0xEE596f3230b739D66763662128CCaC9450B36E96';
const RPC = 'https://rpc-bradbury.genlayer.com';
const ABI = [
  'function submit_vehicle(string vin, string make, string model, string year)',
  'function process_vehicle(string vehicle_id)',
  'function get_vehicle(string vehicle_id) view returns (string)',
  'function get_record(string vin) view returns (string)',
  'function get_vehicle_count() view returns (uint256)',
  'function get_stats() view returns (tuple(uint256 total, uint256 completed, uint256 clean, uint256 damaged, uint256 flooded, uint256 salvage, uint256 inconclusive, uint256 records))',
];
let contract, account;
const readProvider = new ethers.providers.JsonRpcProvider(RPC);
const readContract = new ethers.Contract(CONTRACT, ABI, readProvider);

async function connectWallet() {
  if (!window.ethereum) return alert('Install MetaMask');
  await window.ethereum.request({ method: 'eth_requestAccounts' });
  const provider = new ethers.providers.Web3Provider(window.ethereum);
  const signer = provider.getSigner();
  account = await signer.getAddress();
  contract = new ethers.Contract(CONTRACT, ABI, signer);
  return account;
}

document.getElementById('connectBtn').onclick = async () => {
  try {
    const addr = await connectWallet();
    document.getElementById('connectBtn').textContent = addr.slice(0,6)+'...'+addr.slice(-4);
    document.getElementById('connectBtn').className = 'btn btn-primary btn-sm';
    toast('Wallet connected!', 'success');
  } catch(e) { toast(e.message, 'error'); }
};

function renderVerdict(jsonStr) {
  try {
    const v = JSON.parse(jsonStr);
    const st = (v.status || (v.recalled ? 'DAMAGED' : 'CLEAN')).toLowerCase();
    const badge = '<span class="tag tag-' + st + '">' + (v.status || '') + '</span>';
    const sev = v.severity ? '<span class="tag tag-' + v.severity.toLowerCase() + '">' + v.severity + '</span>' : '';
    const srcs = v.sources && v.sources.length
      ? '\nSources:\n  ' + v.sources.map(s => (s.retrieved ? '✓' : '✗') + ' ' + s.url).join('\n  ')
      : '';
    return badge + (sev ? ' Severity: ' + sev : '') +
      '\nMatched records: ' + JSON.stringify(v.matched_records) +
      (v.recalled ? '\n⚠ Open recall flagged' : '') +
      srcs +
      '\nReasoning: ' + v.reasoning;
  } catch(e) { return jsonStr; }
}

async function loadStats() {
  try {
    const s = await readContract.get_stats();
    document.getElementById('statTotal').textContent = s.total.toString();
    document.getElementById('statClean').textContent = s.clean.toString();
    document.getElementById('statDamaged').textContent = s.damaged.toString();
    document.getElementById('statSalvage').textContent = s.salvage.toString();
    document.getElementById('statInconclusive').textContent = s.inconclusive.toString();
    document.getElementById('statRecords').textContent = s.records.toString();
  } catch(e) { console.log(e); }
}

document.getElementById('submitBtn').onclick = async () => {
  const vin = document.getElementById('vin').value.trim();
  const make = document.getElementById('make').value.trim();
  const model = document.getElementById('model').value.trim();
  const year = document.getElementById('year').value.trim();
  if (!vin || !make) return toast('Enter VIN and make', 'error');
  try {
    if (!contract) await connectWallet();
    const tx = await contract.submit_vehicle(vin, make, model || '', year || '');
    document.getElementById('submitStatus').innerHTML = `<span style="color:#6ee7b7;">Submitted! <a class="explorer-link" href="https://explorer-bradbury.genlayer.com/tx/${tx.hash}" target="_blank">${tx.hash.slice(0,10)}...</a></span>`;
    await tx.wait();
    toast('Vehicle check submitted!', 'success');
    loadStats();
  } catch(e) { toast(e.reason || e.message, 'error'); }
};

document.getElementById('processBtn').onclick = async () => {
  const id = document.getElementById('checkId').value.trim();
  if (!id) return toast('Enter check ID', 'error');
  try {
    if (!contract) await connectWallet();
    const tx = await contract.process_vehicle(id);
    document.getElementById('checkStatus').innerHTML = `<span style="color:#6ee7b7;">Processing... <a class="explorer-link" href="https://explorer-bradbury.genlayer.com/tx/${tx.hash}" target="_blank">${tx.hash.slice(0,10)}...</a></span>`;
    await tx.wait();
    toast('Vehicle processed! AI validators reached consensus.', 'success');
    loadStats();
  } catch(e) { toast(e.reason || e.message, 'error'); }
};

document.getElementById('readBtn').onclick = async () => {
  const id = document.getElementById('checkId').value.trim();
  if (!id) return toast('Enter check ID', 'error');
  const out = document.getElementById('checkResult');
  out.textContent = 'Loading from chain...';
  try {
    const r = await readContract.get_vehicle(id);
    out.innerHTML = renderVerdict(JSON.parse(r).verdict || '{}') || r;
  } catch(e) { out.textContent = 'Could not read check: ' + e.message; }
};

document.getElementById('lookupBtn').onclick = async () => {
  const vin = document.getElementById('lookupVin').value.trim();
  if (!vin) return toast('Enter VIN', 'error');
  const out = document.getElementById('lookupResult');
  out.textContent = 'Loading from chain...';
  try {
    const r = await readContract.get_record(vin);
    if (r === '{}') { out.textContent = 'No record for this VIN yet.'; return; }
    out.innerHTML = renderVerdict(r);
  } catch(e) { out.textContent = 'Could not read record: ' + e.message; }
};

function toast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast toast-'+type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 5000);
}

loadStats();
</script>
</body>
</html>
